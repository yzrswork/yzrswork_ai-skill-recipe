name: X Bookmark Logger checks
on:
  pull_request:
    paths:
      - "x-bookmark-logger.user.js"
      - "tests/x-bookmark.test.mjs"
      - ".github/workflows/x-bookmark-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/x-bookmark.test.mjs
