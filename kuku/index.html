<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a6482f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta
    name="description"
    content="小学校2年生向け。2〜9の段を3択で楽しく練習できる、iPhone対応の九九アプリ。"
  />
  <title>九九クエスト｜や印工務店</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="mini-brand" aria-label="や印工務店">
        <span class="brand-mark" aria-hidden="true">y.</span>
        <span>や印工務店</span>
      </div>
      <button
        class="sound-toggle"
        id="sound-toggle"
        type="button"
        aria-pressed="false"
        aria-label="効果音をオンにする"
      >
        <span aria-hidden="true">♪</span>
        <span id="sound-label">おと OFF</span>
      </button>
    </header>

    <main class="game" id="game">
      <section class="title-block" aria-labelledby="app-title">
        <p class="eyebrow">10もん ミニクエスト</p>
        <h1 id="app-title">九九クエスト</h1>
        <p class="subtitle">3つの こたえから えらぼう！</p>
      </section>

      <section class="quest-card" id="quiz-panel" aria-labelledby="question-label">
        <div class="status-row">
          <div>
            <span class="status-caption">もんだい</span>
            <strong class="status-value" id="question-count">1 / 10</strong>
          </div>
          <div class="best-score">
            <span class="status-caption">じこベスト</span>
            <strong class="status-value"><span id="best-score">0</span> / 10</strong>
          </div>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="クエストの進み具合"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
          id="progress"
        >
          <span class="progress-fill" id="progress-fill"></span>
        </div>

        <div class="streak-row">
          <span class="streak-chip" id="streak-chip" aria-live="polite">まずは 1もん！</span>
          <span class="first-try-score" aria-label="一回で正解した数">
            <span aria-hidden="true">★</span>
            <span id="score">0</span>
          </span>
        </div>

        <div class="problem-area">
          <p class="question-label" id="question-label">こたえは どれ？</p>
          <div class="equation" aria-live="polite" aria-atomic="true">
            <span id="factor-a">2</span>
            <span class="operator" aria-label="かける">×</span>
            <span id="factor-b">4</span>
          </div>
        </div>

        <p class="feedback" id="feedback" aria-live="assertive" aria-atomic="true">
          したから えらんでね
        </p>

        <div class="answers" id="answers" role="group" aria-label="3つの答え">
          <!-- JavaScriptで回答ボタンを表示 -->
        </div>
      </section>

      <section class="finish-card" id="finish-panel" hidden aria-labelledby="finish-title">
        <div class="finish-medal" id="finish-medal" aria-hidden="true">★</div>
        <p class="finish-kicker">10もん クリア！</p>
        <h2 id="finish-title">やったね！</h2>
        <p class="finish-message" id="finish-message">九九の力が アップした！</p>

        <div class="result-grid">
          <div class="result-item">
            <span>いっぱつ せいかい</span>
            <strong><span id="final-score">0</span><small> / 10</small></strong>
          </div>
          <div class="result-item">
            <span>さいこう れんぞく</span>
            <strong><span id="final-streak">0</span><small> もん</small></strong>
          </div>
        </div>

        <p class="best-message" id="best-message" aria-live="polite"></p>
        <button class="restart-button" id="restart-button" type="button">
          もう 10もん！
        </button>
      </section>

      <p class="gentle-note">まちがえても だいじょうぶ。えらびなおせるよ。</p>
    </main>

    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  </div>
</body>
</html>
