<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Pass 2 素材比較｜九九クエスト</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#0b1322; color:#fff9ed; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; }
    main { width:min(100% - 32px,1200px); margin:24px auto; }
    h1 { font-size:clamp(22px,4vw,32px); margin:0 0 12px; }
    h2 { margin:32px 0 16px; font-size:22px; }
    p { line-height:1.8; color:#c7d5eb; }
    a { color:#d4e9ff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    #comparison { grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); }
    article { background:#17253b; border:1px solid #526987; border-radius:12px; overflow:hidden; }
    h3 { font-size:16px; padding:14px; margin:0; background:#1c2e49; }
    .pair { display:grid; grid-template-columns:1fr 1fr; }
    figure { margin:0; padding:12px 4px; text-align:center; }
    figure + figure { border-left:1px solid #526987; }
    img { width:100%; height:190px; object-fit:contain; }
    figcaption { color:#c7d5eb; font-size:12px; margin:8px 0; }
    .roster figure { padding:14px; background:#17253b; border:1px solid #526987; border-radius:12px; }
    .roster img { height:210px; }
    .roster { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
    .roster figcaption { color:#fff9ed; font-size:14px; }
    :focus-visible { outline:3px solid #ffd28f; outline-offset:4px; }
    @media (max-width:520px) { main { width:calc(100% - 24px); } img { height:160px; } }
  </style>
</head>
<body>
<main>
  <h1>九九クエスト Visual Pass 2</h1>
  <p>体型・表情・構え・装備の違いを重視した、独自のモンスターイラスト。ゲームの保存・出題・進行は維持しています。<a href="./">ゲームへ</a></p>
  <h2>重点ボス5体：改修前 / 改修後</h2>
  <section id="comparison" class="grid" aria-label="重点ボスの素材比較"></section>
  <h2>モンスターを並べて見る</h2>
  <section id="roster" class="grid roster" aria-label="モンスターの一覧"></section>
  <h2>冒険の道具</h2>
  <section id="weapons" class="grid roster" aria-label="武器の進化"></section>
  <h2>旅の舞台</h2>
  <section id="backgrounds" class="grid" aria-label="背景の一覧"></section>
</main>
<script type="module">
  import { VISUAL_ASSETS, assetUrl } from './js/assets.js';
  const priority = ['boss-4','boss-3','boss-5','boss-9','boss-zero'];
  function figure(asset, old = false) {
    const node = document.createElement('figure'), image = document.createElement('img'), caption = document.createElement('figcaption');
    image.src = old ? `assets/${asset.id}.svg` : assetUrl(asset.id);
    image.alt = `${asset.name}${old ? ' 改修前' : ' 改修後'}`;
    image.width = 240; image.height = 240;
    caption.textContent = old ? '改修前 · SVG' : `改修後 · ${asset.kind === 'background' ? '' : '透過'}WebP`;
    node.append(image, caption); return node;
  }
  for (const id of priority) {
    const asset = VISUAL_ASSETS.find(item => item.id === id), article = document.createElement('article'), heading = document.createElement('h3'), pair = document.createElement('div');
    heading.textContent = asset.name; pair.className = 'pair';
    pair.append(figure(asset,true),figure(asset)); article.append(heading,pair); document.getElementById('comparison').append(article);
  }
  for (const asset of VISUAL_ASSETS) {
    const node = figure(asset); node.querySelector('figcaption').textContent = asset.name;
    const section = asset.kind === 'weapon' ? 'weapons' : asset.kind === 'background' ? 'backgrounds' : 'roster';
    document.getElementById(section).append(node);
  }
</script>
</body>
</html>
