<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>花火</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  }

  body {
    background: radial-gradient(ellipse 120% 80% at 50% 100%, #1a2844 0%, #0a0e1a 45%, #050810 100%);
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    position: fixed;
    inset: 0;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: max(2rem, env(safe-area-inset-bottom, 0px) + 1.5rem);
  }

  .title {
    position: fixed;
    top: max(1.5rem, env(safe-area-inset-top, 0px) + 1rem);
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    color: rgba(255, 255, 255, 0.55);
    text-indent: 0.35em;
    transition: opacity 1.2s ease;
  }

  .title.hidden { opacity: 0; }

  .hint {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.35);
    transition: opacity 1s ease;
  }

  .hint.hidden { opacity: 0; }

  .controls {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top, 0px) + 0.75rem);
    right: max(1rem, env(safe-area-inset-right, 0px) + 0.75rem);
    z-index: 20;
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    pointer-events: auto;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .btn:focus-visible { outline: 2px solid #ffdc96; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .title, .hint, .btn { transition: none; }
  }

  .btn.active {
    color: rgba(255, 220, 150, 0.95);
    border-color: rgba(255, 220, 150, 0.35);
  }
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</head>
<body>
<canvas id="c" role="img" aria-label="夜空の花火。タップで打ち上げ、3本指で大きな花火。"></canvas>

<div class="controls">
  <button class="btn active" id="soundBtn" type="button" aria-label="サウンド" aria-pressed="true">♪</button>
  <button class="btn active" id="autoBtn" type="button" aria-label="自動打ち上げ" aria-pressed="true">✦</button>
</div>

<h1 class="title" id="title">花火</h1>
<div class="overlay">
  <p class="hint" id="hint">タップで打ち上げ</p>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const soundBtn = document.getElementById('soundBtn');
  const autoBtn = document.getElementById('autoBtn');
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = motionQuery.matches;
  let W = 0, H = 0, dpr = 1, sky;
  let soundOn = true, autoOn = !reducedMotion, interacted = false;
  let simulationTime = 0, autoTimer = 1.2, autoPhrase = 2, phraseIndex = 0;
  let megaCooldownUntil = 0;
  let lastTime = 0, accumulator = 0, raf = 0, paused = document.hidden;
  const STEP = 1 / 60;
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const PALETTES = [
    [255, 65, 68], [255, 190, 72], [255, 106, 169],
    [85, 180, 255], [80, 235, 150], [190, 138, 255], [245, 245, 228]
  ];
  const GOLD = 7;
  const COLORS = [...PALETTES, [255, 177, 68], [255, 105, 34]];
  const rockets = [], particles = [], sparks = [], flashes = [], pool = [];
  let particleLimit = 640;
  const SPARK_LIMIT = 240, ROCKET_LIMIT = 12;
  // Generated once: no per-particle gradients, filters or external image assets.
  const sprites = COLORS.map(color => {
    const image = document.createElement('canvas');
    image.width = image.height = 48;
    const c = image.getContext('2d');
    const g = c.createRadialGradient(24, 24, 0, 24, 24, 24);
    g.addColorStop(0, '#fff9e9');
    g.addColorStop(0.055, `rgb(${color})`);
    g.addColorStop(0.19, `rgba(${color},0.52)`);
    g.addColorStop(0.45, `rgba(${color},0.12)`);
    g.addColorStop(1, `rgba(${color},0)`);
    c.fillStyle = g;
    c.fillRect(0, 0, 48, 48);
    return image;
  });

  function resize() {
    W = innerWidth; H = innerHeight;
    const mobile = matchMedia('(pointer: coarse)').matches || W < 700;
    particleLimit = mobile ? 640 : 900;
    while (particles.length > particleLimit) recycle(0);
    // Bound both DPR and backing-store area, including landscape/tablet screens.
    dpr = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2, Math.sqrt(2000000 / (W * H)));
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sky = document.createElement('canvas');
    sky.width = canvas.width; sky.height = canvas.height;
    const c = sky.getContext('2d');
    c.scale(dpr, dpr);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050810'); g.addColorStop(0.55, '#090e1a'); g.addColorStop(1, '#141e32');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < Math.min(110, W * H / 8500); i++) {
      c.fillStyle = `rgba(228,236,255,${rand(0.1, 0.32)})`;
      c.beginPath(); c.arc(rand(0, W), rand(0, H * 0.8), rand(0.35, 1), 0, TAU); c.fill();
    }
    ctx.drawImage(sky, 0, 0, W, H);
  }
  addEventListener('resize', resize);
  resize();

  // All voices go through one mute bus and a conservative compressor/output gain.
  // Only unlockAudio (called by a user action) may create/resume the context.
  let audioCtx = null, master = null, noise = null, crackle = null, audioUnavailable = false;
  const voices = new Set();
  function unlockAudio() {
    if (!soundOn || paused || audioUnavailable) return;
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { audioUnavailable = true; return; }
        audioCtx = new AC();
        master = audioCtx.createGain(); master.gain.value = 0;
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -18; compressor.knee.value = 18;
        compressor.ratio.value = 8; compressor.attack.value = 0.004; compressor.release.value = 0.22;
        const output = audioCtx.createGain(); output.gain.value = 0.65;
        master.connect(compressor).connect(output).connect(audioCtx.destination);
        noise = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        crackle = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const n = noise.getChannelData(0), c = crackle.getChannelData(0);
        let envelope = 0;
        for (let i = 0; i < n.length; i++) {
          n[i] = Math.random() * 2 - 1;
          if (Math.random() < 0.0009) envelope = rand(0.3, 1);
          envelope *= 0.985;
          c[i] = n[i] * envelope;
        }
      }
      const resume = audioCtx.state === 'suspended' || audioCtx.state === 'interrupted'
        ? audioCtx.resume() : Promise.resolve();
      Promise.resolve(resume).then(() => {
        if (soundOn && !paused && audioCtx.state === 'running') {
          master.gain.cancelScheduledValues(audioCtx.currentTime);
          master.gain.setTargetAtTime(0.32, audioCtx.currentTime, 0.025);
        }
      }).catch(() => {});
    } catch (_) { audioUnavailable = true; }
  }
  function silenceAudio(suspend = false) {
    if (!audioCtx || !master) return;
    const t = audioCtx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0, t + 0.03);
    // Cancel scheduled echoes too; toggling back on cannot resurrect an old boom.
    for (const source of voices) {
      try { source.stop(suspend ? t : t + 0.035); } catch (_) {}
    }
    if (suspend && audioCtx.state !== 'closed') audioCtx.suspend().catch(() => {});
  }
  function audioReady() {
    return !audioUnavailable && soundOn && !paused && master && noise && crackle && audioCtx?.state === 'running' && voices.size < 28;
  }
  function voice(source, filter, t, duration, volume, attack = 0.008) {
    const ac = audioCtx;
    if (voices.size >= 28) return;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume / Math.sqrt(1 + voices.size * 0.18), t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    source.connect(filter).connect(gain).connect(master);
    voices.add(source);
    source.onended = () => { voices.delete(source); source.disconnect(); filter.disconnect(); gain.disconnect(); };
    source.start(t); source.stop(t + duration + 0.02);
  }
  function noiseVoice(t, duration, volume, frequency, type = 'lowpass', buffer = noise, attack = 0.008) {
    const source = audioCtx.createBufferSource(); source.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = type; filter.frequency.setValueAtTime(frequency, t);
    filter.Q.value = 0.65;
    voice(source, filter, t, duration, volume, attack);
    return filter;
  }
  function playLaunch(mega) {
    if (!audioReady()) return;
    const t = audioCtx.currentTime;
    const filter = noiseVoice(t, mega ? 0.9 : 0.66, 0.16, 550, 'bandpass', noise, 0.045);
    filter.frequency.exponentialRampToValueAtTime(mega ? 1850 : 1450, t + 0.48);
    noiseVoice(t, 0.15, mega ? 0.24 : 0.16, 160);
  }
  function playBoom(type, mega) {
    if (!audioReady()) return;
    const ac = audioCtx, t = ac.currentTime + (mega ? 0.085 : 0.045);
    const level = mega ? 0.65 : type === 'willow' ? 0.34 : 0.46;
    noiseVoice(t, 0.23, level, 2400); // sharp, with a short ramp instead of a discontinuity
    noiseVoice(t + 0.018, mega ? 1.3 : 0.88, level * 0.9, mega ? 170 : 260);
    noiseVoice(t + 0.16, 1.4, level * 0.19, 440); // diffuse, quieter delayed rumble
    const bass = ac.createOscillator(); bass.type = 'sine';
    bass.frequency.setValueAtTime(mega ? 72 : 95, t);
    bass.frequency.exponentialRampToValueAtTime(32, t + 0.48);
    const lowpass = ac.createBiquadFilter(); lowpass.frequency.value = 180;
    voice(bass, lowpass, t, mega ? 0.85 : 0.6, level * 0.55, 0.014);
    if (type === 'willow' || mega) noiseVoice(t + 0.42, 1.7, 0.17, 2600, 'highpass', crackle, 0.03);
  }

  function glow(x, y, size, color, alpha) {
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.drawImage(sprites[color], x - size, y - size, size * 2, size * 2);
  }
  function ember(x, y, vx, vy, life, size = 1) {
    if (sparks.length >= SPARK_LIMIT) return;
    sparks.push({ x, y, vx, vy, age: 0, life, size });
  }
  function recycle(index) {
    const p = particles[index];
    particles[index] = particles[particles.length - 1]; particles.pop(); pool.push(p);
  }
  function addStar(x, y, vx, vy, life, color, willow, size) {
    if (particles.length >= particleLimit) return;
    const p = pool.pop() || { trail: new Float32Array(24) };
    Object.assign(p, { x, y, vx, vy, life, color, willow, size, age: 0,
      drag: willow ? rand(0.55, 0.7) : rand(0.82, 1.05), gravity: willow ? 35 : 29,
      phase: rand(0, TAU), brightness: rand(0.72, 1), emission: rand(0.025, 0.065), head: 0, points: 1 });
    p.trail[0] = x; p.trail[1] = y;
    particles.push(p);
  }
  function burst(x, y, type, color, mega = false) {
    const willow = type === 'willow';
    const count = reducedMotion ? 64 : mega ? 216 : type === 'ring' ? 88 : willow ? 104 : 126;
    // Make room for a fresh response even when a child taps continuously.
    while (particles.length > particleLimit - count - (mega ? 40 : 0)) recycle(0);
    const radius = Math.min(W * (mega ? 0.47 : 0.36), H * (mega ? 0.31 : 0.24), mega ? 310 : 215);
    const speed = radius * (willow ? 1.48 : 1.75) * (reducedMotion ? 0.7 : 1);
    const tilt = rand(0.5, 0.88), rotation = rand(0, TAU);
    for (let i = 0; i < count; i++) {
      let dx, dy, z;
      if (type === 'ring') {
        const a = i / count * TAU + rand(-0.012, 0.012);
        const rx = Math.cos(a), ry = Math.sin(a) * tilt;
        dx = rx * Math.cos(rotation) - ry * Math.sin(rotation);
        dy = rx * Math.sin(rotation) + ry * Math.cos(rotation);
        z = Math.sin(a);
      } else {
        // Even spherical shell projected onto the screen; slight variation keeps it organic.
        z = 1 - 2 * (i + 0.5) / count;
        const a = i * 2.3999632297 + rand(-0.035, 0.035);
        const r = Math.sqrt(1 - z * z);
        dx = Math.cos(a) * r; dy = Math.sin(a) * r;
      }
      const variation = rand(0.93, 1.07);
      const life = willow ? rand(3.4, 4.7) : rand(1.9, 2.65);
      addStar(x, y, dx * speed * variation, dy * speed * variation - (willow ? 16 : 0),
        life, willow ? GOLD : color, willow, rand(0.8, 1.25) * (0.85 + (z + 1) * 0.13));
    }
    if (mega) {
      // One coherent gold shell with a smaller warm-white pistil, instead of rainbow blasts.
      for (let i = 0; i < 40; i++) {
        const a = i * 2.3999632297, z = 1 - 2 * (i + 0.5) / 40;
        const r = Math.sqrt(1 - z * z) * speed * 0.38;
        addStar(x, y, Math.cos(a) * r, Math.sin(a) * r, rand(1.4, 2), 6, false, 1);
      }
    }
    if (flashes.length >= 6) flashes.shift();
    flashes.push({ x, y, age: 0, size: radius * 0.7, color: willow ? GOLD : color });
    playBoom(type, mega);
  }
  function spawnFirework(tx, ty, color = Math.floor(rand(0, PALETTES.length)), mega = false, type = null) {
    if (paused) return;
    // Preserve older shells so a stream of taps cannot keep every shell from reaching its apex.
    if (rockets.length >= ROCKET_LIMIT) rockets.pop();
    const x = clamp(tx, 8, W - 8), y = clamp(ty, 55, H * 0.8);
    const sx = clamp(x + rand(-W * 0.14, W * 0.14), 8, W - 8);
    rockets.push({ x: sx, y: H + 8, sx, sy: H + 8, tx: x, ty: y,
      age: 0, duration: mega ? 1.25 : rand(0.85, 1.12), emission: 0, mega,
      color, type: type || (mega ? 'willow' : ['chrysanthemum', 'chrysanthemum', 'ring', 'willow'][Math.floor(rand(0, 4))]) });
    playLaunch(mega);
  }
  function spawnMegaFirework(x, y) { spawnFirework(x, Math.min(y, H * 0.4), GOLD, true, 'willow'); }
  function triggerMegaFirework(points) {
    if (simulationTime < megaCooldownUntil) return;
    megaCooldownUntil = simulationTime + 2.8;
    onInteract();
    spawnMegaFirework(points.reduce((s, p) => s + p.x, 0) / points.length,
      points.reduce((s, p) => s + p.y, 0) / points.length);
  }

  function autoLaunch() {
    // Three short phrases: a solitary bloom / a loose pair / a restrained three-shot fan.
    // All scheduling uses simulation time: no residual setTimeouts after OFF/hide.
    if (phraseIndex === 0) autoPhrase = (autoPhrase + 1) % 3;
    const count = autoPhrase + 1;
    const x = count === 1 ? rand(0.3, 0.7) : 0.24 + phraseIndex / (count - 1) * 0.52;
    spawnFirework(W * x, H * rand(0.22, 0.4));
    phraseIndex++;
    if (phraseIndex >= count) { phraseIndex = 0; autoTimer = reducedMotion ? rand(5, 7) : rand(3.8, 5.6); }
    else autoTimer = rand(0.5, 0.82);
  }
  function step(dt) {
    simulationTime += dt;
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.age += dt;
      const p = Math.min(r.age / r.duration, 1);
      // Decelerate toward the apex, then burst before a visible hover.
      const ease = 1 - (1 - p) ** 2;
      const oldX = r.x, oldY = r.y;
      r.x = lerp(r.sx, r.tx, ease); r.y = lerp(r.sy, r.ty, ease);
      r.emission -= dt;
      if (r.emission <= 0) {
        ember(r.x, r.y, (oldX - r.x) * 4 + rand(-7, 7), rand(15, 35), rand(0.2, 0.46), r.mega ? 1.25 : 0.8);
        r.emission = reducedMotion ? 0.05 : 0.018;
      }
      if (p >= 1) { burst(r.x, r.y, r.type, r.color, r.mega); rockets.splice(i, 1); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.age += dt;
      if (p.age >= p.life || p.y > H + 80) { recycle(i); continue; }
      const drag = Math.exp(-p.drag * dt);
      p.vx *= drag; p.vy = p.vy * drag + p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.head = (p.head + 1) % 12;
      p.trail[p.head * 2] = p.x; p.trail[p.head * 2 + 1] = p.y; p.points = Math.min(p.points + 1, 12);
      p.emission -= dt;
      if (p.emission <= 0 && !reducedMotion && p.age < p.life * 0.78) {
        ember(p.x, p.y, p.vx * 0.16 + rand(-5, 5), p.vy * 0.16 + rand(3, 14), rand(0.25, p.willow ? 0.75 : 0.45), 0.5);
        p.emission = p.willow ? rand(0.05, 0.1) : rand(0.12, 0.22);
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.age += dt;
      if (s.age >= s.life) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      s.vx *= Math.exp(-1.6 * dt); s.vy += 26 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      flashes[i].age += dt; if (flashes[i].age > 0.45) flashes.splice(i, 1);
    }
    if (autoOn) { autoTimer -= dt; if (autoTimer <= 0) autoLaunch(); }
  }
  function render(dt) {
    ctx.globalCompositeOperation = 'source-over';
    // A time-based afterimage over the cached dark sky, independent of refresh rate.
    ctx.globalAlpha = reducedMotion ? 1 : 1 - Math.exp(-10 * dt);
    ctx.drawImage(sky, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    if (!reducedMotion) for (const f of flashes) {
      glow(f.x, f.y, f.size, f.color, 0.22 * Math.exp(-f.age * 13));
      glow(f.x, f.y, 19, 6, 0.75 * Math.exp(-f.age * 24));
    }
    for (const r of rockets) glow(r.x, r.y, r.mega ? 11 : 7.5, GOLD, 0.9);
    for (const p of particles) {
      const progress = p.age / p.life;
      const fade = Math.pow(1 - progress, 0.65);
      const flicker = progress > 0.65 && !reducedMotion ? 0.66 + 0.34 * Math.sin(p.age * 42 + p.phase) ** 2 : 1;
      const alpha = fade * flicker * p.brightness;
      const color = p.willow ? (progress > 0.68 ? 8 : GOLD) : progress > 0.82 ? GOLD : p.color;
      const rgb = COLORS[color];
      ctx.globalAlpha = alpha * (p.willow ? 0.65 : 0.5);
      ctx.strokeStyle = `rgb(${rgb})`; ctx.lineWidth = p.size * (p.willow ? 1 : 0.8);
      ctx.beginPath();
      for (let j = 0; j < p.points; j++) {
        const index = (p.head - j + 12) % 12;
        const x = p.trail[index * 2], y = p.trail[index * 2 + 1];
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      glow(p.x, p.y, p.size * (p.willow ? 5 : 6), color, alpha * 0.85);
      if (progress < 0.68) {
        ctx.globalAlpha = alpha * (1 - progress); ctx.fillStyle = '#fff9e9';
        ctx.fillRect(p.x - 0.45, p.y - 0.45, 0.9, 0.9);
      }
    }
    for (const s of sparks) glow(s.x, s.y, 2.6 * s.size, s.age / s.life > 0.55 ? 8 : GOLD, (1 - s.age / s.life) * 0.65);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  function update(now) {
    if (paused) return;
    const elapsed = lastTime ? clamp((now - lastTime) / 1000, 0, 0.1) : STEP;
    lastTime = now; accumulator += elapsed;
    let steps = 0;
    while (accumulator + 1e-9 >= STEP && steps < 6) { step(STEP); accumulator = Math.max(0, accumulator - STEP); steps++; }
    render(elapsed);
    raf = requestAnimationFrame(update);
  }
  function onInteract() {
    if (!interacted) { interacted = true; titleEl.classList.add('hidden'); hintEl.classList.add('hidden'); }
    unlockAudio();
    autoTimer = 3.8; phraseIndex = 0; // Give manual launches room, without delaying the tap.
  }

  if (!paused) raf = requestAnimationFrame(update);
