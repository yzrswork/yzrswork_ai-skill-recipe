<!doctype html>
<html lang="ja">
<head>

<title>おにさんダンス！ — ちいさな おんがくひろば</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light;--ink:#344a51;--coral:#ed6c70;--mint:#ecf8f2;--cream:#fffcf2}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--mint);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;font-weight:800}
button:focus-visible{outline:3px solid #445bba;outline-offset:3px}
button:active{transform:translateY(3px);box-shadow:none!important}
svg{display:block;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
[hidden]{display:none!important}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;letter-spacing:.02em}.brand small{display:block;font-size:9px;letter-spacing:.17em;color:#627c78;margin-top:2px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:15px;background:#ffda8d;box-shadow:0 3px 0 #e7bd75;color:#735748}.brand-mark svg{width:27px;height:27px}
.round{width:56px;height:56px;flex:none;display:grid;place-items:center;background:#fffdf7;border:2px solid #fff;box-shadow:0 3px 0 #d4e4dc;border-radius:21px}.round svg{width:25px;height:25px}
#sound{gap:0;grid-template-rows:29px 13px;align-content:center;font-size:9px;color:#4e6361}
#sound[aria-pressed="false"] .sound-wave{display:none}#sound[aria-pressed="true"] .sound-slash{display:none}
#scene{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:36px;overflow:hidden;isolation:isolate;background:#e1f4eb;border:3px solid #fffdf5;box-shadow:0 5px 0 #d4e8df}
#c{width:100%;height:100%;display:block;touch-action:none;outline-offset:-5px}
.intro{position:absolute;top:22px;left:8px;right:8px;text-align:center;pointer-events:none}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;color:#5f7b71}.intro h1{font-size:clamp(27px,7.9vw,40px);letter-spacing:-.06em;margin:7px 0 5px;color:#3c5557}.intro h1 span{color:#da5a60}.intro p{margin:0;font-size:12px;font-weight:700;color:#5b746c}
#hint{position:absolute;top:17px;left:8px;right:8px;display:flex;justify-content:center;pointer-events:none}#hint span{background:#fffef3e8;border:2px solid #fff;border-radius:24px;padding:10px 18px;font-size:13px;font-weight:800;box-shadow:0 3px 0 #d4e8df}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;font-size:21px;font-weight:900;color:#4a6264}#hud small{display:block;font-size:10px;margin-top:3px;color:#657d76}#lives{font-size:21px;letter-spacing:3px;color:#d75f6a}
#footer{flex:none;padding:16px 20px 13px}
#home-controls{display:grid;grid-template-columns:1fr;gap:10px;max-width:440px;margin:auto}
.big-button{min-height:58px;display:flex;align-items:center;justify-content:center;gap:11px;padding:12px 18px;border-radius:24px;font-size:19px;border:2px solid #fff8;box-shadow:0 5px 0 #cb555c;background:#ed777b;color:#fff}
.big-button svg{width:27px;height:27px;flex:none}.big-button.secondary{min-height:56px;background:#fffcf2;color:#516a65;font-size:14px;box-shadow:0 4px 0 #d8e5d8;border:2px solid #fff}.secondary svg{width:23px;height:23px;color:#729c8a}
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:470px;margin:auto}
.action{min-width:0;min-height:82px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;border:2px solid #fff9;background:#ffd78a;box-shadow:0 5px 0 #deb56b;color:#705632}.action svg{width:32px;height:32px}.action:nth-child(2){background:#c1dce9;box-shadow:0 5px 0 #97b9ce;color:#46667c}.action:nth-child(3){background:#ddd0ef;box-shadow:0 5px 0 #b5a2cf;color:#685380}
.footnote{text-align:center;font-size:10px;font-weight:700;letter-spacing:.07em;color:#5e7870;margin:12px 0 0}#game-help{text-align:center;font-size:13px;font-weight:800;margin:4px 0 12px;line-height:1.8}
#over{position:absolute;inset:0;background:#ecf8f2d9;z-index:5;display:grid;place-items:center;padding:16px}#over-card{width:min(100%,320px);background:#fffdf2;border:3px solid white;box-shadow:0 9px 0 #d1e6dc;border-radius:35px;padding:27px 20px;text-align:center}#over-card>svg{width:46px;height:46px;margin:auto;color:#c58d3c}#over h2{font-size:24px;margin:12px 0}#overScore{font-size:22px;font-weight:900}#overBest{font-size:12px;margin:6px 0 22px}.retry{width:100%;font-size:17px}#overHome{min-height:56px;width:100%;background:transparent;font-size:13px;margin-top:8px}
@media(max-height:680px) and (orientation:portrait){header{height:66px;padding:5px 14px}#footer{padding:13px 18px 10px}.intro{top:16px}.intro h1{margin:5px 0}.footnote{margin-top:9px}.action{min-height:76px}}
@media(orientation:landscape) and (max-height:550px){#app{display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:64px minmax(0,1fr)}header{grid-column:1/-1;height:64px;padding:4px 16px}#scene{height:calc(100% - 12px);margin:0 0 12px 12px;border-radius:28px}#footer{padding:8px 14px;align-self:center}#actions{gap:8px;grid-template-columns:1fr}.action{min-height:56px;flex-direction:row;gap:10px;border-radius:19px}.action svg{width:25px;height:25px}.big-button{font-size:15px;padding:9px;min-height:58px}.big-button.secondary{font-size:12px}.intro{top:10px}.intro h1{font-size:25px;margin:4px 0}.intro p{font-size:10px}.eyebrow{font-size:8px}.footnote{font-size:9px;line-height:1.7}#hint{top:8px}#hint span{padding:7px 14px;font-size:11px}#over-card{padding:12px 18px;width:min(100%,390px)}#over-card>svg{display:none}#over h2{font-size:20px;margin:0 0 4px}#overBest{margin:2px 0 8px}.retry{min-height:56px}#overHome{margin:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="i-music" viewBox="0 0 32 32"><path d="M12 23V8l15-3v15M12 12l15-3"/><ellipse cx="8" cy="24" rx="4" ry="3"/><ellipse cx="23" cy="21" rx="4" ry="3"/></symbol>

<div id="app" data-view="home">
<header>
<button id="back" class="round" aria-label="あそびを おわって もどる" hidden><svg aria-hidden="true"><use href="#i-home"/></svg></button>
<div class="brand"><span class="brand-mark"><svg aria-hidden="true"><use href="#i-music"/></svg></span><span>おにさんダンス！<small>ちいさな おんがくひろば</small></span></div>
<button id="sound" class="round" aria-label="おとを けす" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h6l7-6v20l-7-6H5Z"/><path class="sound-wave" d="M23 11q6 5 0 10m4-14q9 9 0 18"/><path class="sound-slash" d="m23 12 7 8m0-8-7 8"/></svg><span>おと あり</span></button>
</header>
<main id="scene">
<canvas id="c" tabindex="0" role="img" aria-label="あか・あお・みどりのおにさん。タッチでダンス、ドラッグでおさんぽ。下のボタンでもあそべます。"></canvas>
<div class="intro" id="intro"><div class="eyebrow">いっしょに あそぼう</div><h1>おにさん<span>ダンス！</span></h1><p>さわって、はずんで、にっこり。</p></div>
<div id="hint" hidden><span id="hintText">おにさんを さわってみよう</span></div>
<div id="hud" hidden><div><span id="score">★ 0</span><small id="best">ベスト 0</small></div><div id="lives" aria-label="のこり 3かい">♥♥♥</div></div>
<div id="over" hidden role="dialog" aria-modal="true" aria-labelledby="overTitle"><div id="over-card"><svg aria-hidden="true"><use href="#i-star"/></svg><h2 id="overTitle">いっぱい あそんだね！</h2><div id="overScore"></div><div id="overBest"></div><button class="big-button retry"><svg aria-hidden="true"><use href="#i-play"/></svg>もういちど</button><button id="overHome">おうちへ もどる</button></div></div>
</main>
<footer id="footer">
<div id="home-controls"><button class="big-button" data-mode="dance"><svg aria-hidden="true"><use href="#i-play"/></svg>いっしょに おどろう</button><button class="big-button secondary" data-mode="game"><svg aria-hidden="true"><use href="#i-catch"/></svg>キャッチで あそぶ</button></div>
<div id="actions" hidden><button class="action" data-action="jump"><svg aria-hidden="true"><use href="#i-jump"/></svg>ぴょん！</button><button class="action" data-action="spin"><svg aria-hidden="true"><use href="#i-spin"/></svg>くるり！</button><button class="action" data-action="dress"><svg aria-hidden="true"><use href="#i-hat"/></svg>へんしん！</button></div>
<p id="game-help" hidden>おやつを キャッチ！<br>ばくだんは よけよう</p>
<p class="footnote" id="footnote">タッチで あそべる、おにの おともだち。</p>
</footer>
</div>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app"), canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var scene = document.getElementById("scene"), W = 0, H = 0, DPR = 1, view = "home";
  var reducedQuery = matchMedia("(prefers-reduced-motion: reduce)"), reduced = reducedQuery.matches;
  var rhythmTime = 0, visualTime = 0, raf = 0, lastFrame = 0, drag = null, selected = 0;
  var TAU = Math.PI * 2, onis = [], bgCanvas = document.createElement("canvas"), bgCtx = bgCanvas.getContext("2d");
  function nowClock() { return visualTime; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function resize() {
    var r = canvas.getBoundingClientRect(); W = r.width; H = r.height;
    if (!W || !H) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cancelDrag(); layoutOnis(); paintBackdrop();
  }
  /* ================= audio ================= */
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, master = null, noiseBuf = null, sources = new Set();
  function trackSource(source, cleanup) {
    if (sources.size >= 64) { var oldest = sources.values().next().value; try { oldest.stop(); } catch (e) {} sources.delete(oldest); }
    sources.add(source);
    source.onended = function () { sources.delete(source); cleanup(); };
  }
  function ensureAudio() {
    if (!musicOn || document.hidden || view === "home") return null;
    try {
    if (!actx && AC) {
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.28;
      master.connect(actx.destination);
      // white-noise buffer for hats / claps
      var n = actx.sampleRate * 0.4;
      noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx && actx.state === "suspended") actx.resume().catch(function () {});
    return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, when, glideTo) {
    if (!actx || !musicOn || document.hidden || view === "home") return;
    var t0 = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    trackSource(o, function () { o.disconnect(); g.disconnect(); });
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseHit(when, hp, dur, vol) {
    if (!actx || !noiseBuf || !musicOn || document.hidden || view === "home") return;
    var t0 = actx.currentTime + (when || 0);
    var s = actx.createBufferSource(); s.buffer = noiseBuf;
    var f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
    var g = actx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    trackSource(s, function () { s.disconnect(); f.disconnect(); g.disconnect(); });
    s.start(t0); s.stop(t0 + dur + 0.02);
  }
  function kick(when) {
    if (!actx || !musicOn || document.hidden || view === "home") return;
    var t0 = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t0);
    o.frequency.exponentialRampToValueAtTime(46, t0 + 0.13);
    g.gain.setValueAtTime(0.75, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
    o.connect(g); g.connect(master);
    trackSource(o, function () { o.disconnect(); g.disconnect(); });
    o.start(t0); o.stop(t0 + 0.19);
  }
  function cheer() {
    var s = [523, 659, 784, 1046, 1319];
    for (var i = 0; i < s.length; i++) tone(s[i], 0.28, "triangle", 0.3, i * 0.05);
    noiseHit(0.02, 6000, 0.5, 0.25);
  }
  function speak(t) {
    try {
      if (!musicOn || document.hidden || view === "home" || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.volume = 0.35; u.lang = "ja-JP"; u.rate = 0.95; u.pitch = 1.5;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ================= music sequencer ================= */
  var bpm = 112, musicOn = true, musicStart = 0;
  // 16 eighth-notes (8 beats). Chords: C  Am  F  G (2 beats each)
  var melody = [659,0,784,1046, 880,0,659,880, 698,0,880,698, 784,0,587,784];
  var bassR  = [130.81,0,130.81,0, 110,0,110,0, 87.31,0,87.31,0, 98,0,98,0];
  var step = 0, nextTime = 0, timer = null;
  function scheduler() {
    if (!actx || actx.state !== "running" || !musicOn || document.hidden || view === "home") return;
    // A suspended/throttled tab must never replay a backlog of notes.
    if (nextTime < actx.currentTime - 0.15) nextTime = actx.currentTime;
    var ahead = actx.currentTime + 0.14;
    var eighth = 30 / bpm;
    while (nextTime < ahead) {
      var w = nextTime - actx.currentTime;
      var beatIdx = (step / 2) | 0;
      if (step % 2 === 0) kick(w);                          // four-on-floor
      if (step % 2 === 0 && beatIdx % 2 === 1) noiseHit(w, 1800, 0.16, 0.35); // backbeat clap
      noiseHit(w, 9000, 0.03, step % 2 ? 0.10 : 0.05);      // hi-hat / shaker
      var m = melody[step % melody.length]; if (m) tone(m, 0.17, "triangle", 0.14, w);
      var b = bassR[step % bassR.length];   if (b) tone(b, 0.20, "triangle", 0.20, w);
      nextTime += eighth; step++;
    }
  }
  function startMusic() {
    if (!actx || !musicOn || document.hidden || view === "home") return;
    master.gain.setValueAtTime(0.28, actx.currentTime);
    musicStart = actx.currentTime - visualTime + 0.06;
    step = Math.ceil(visualTime * bpm / 30);
    nextTime = musicStart + step * 30 / bpm;
    if (timer) clearInterval(timer);
    timer = setInterval(scheduler, 25);
  }
  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    sources.forEach(function (source) { try { source.stop(); } catch (e) {} }); sources.clear();
    if (master && actx) { master.gain.cancelScheduledValues(actx.currentTime); master.gain.value = 0; master.gain.setValueAtTime(0, actx.currentTime); }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }
  function resumeSound() { if (musicOn && view !== "home" && !document.hidden) { ensureAudio(); startMusic(); } }


  /* ================= particles ================= */
  var parts = [];
  var CONFETTI = ["#ff477e","#ffd34e","#7ed957","#4db6e6","#b07cff","#ff9f45","#ffffff"];
  function confetti(x, y, n, power) {
    n = reduced ? 5 : (n || 26); power = power || 8;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = power * (0.4 + Math.random());
      if (parts.length >= (reduced ? 32 : 150)) parts.shift();
      parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, life:1,
        decay:0.010+Math.random()*0.014, size:6+Math.random()*8,
        color:CONFETTI[(Math.random()*CONFETTI.length)|0], rot:Math.random()*6,
        vr:(Math.random()-0.5)*0.5, kind:"confetti", g:0.16 });
    }
  }
  function sparkle(x, y, n, spread, color) {
    n = reduced ? 2 : (n || 6);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (spread || 3) * (0.3 + Math.random());
      if (parts.length >= (reduced ? 32 : 150)) parts.shift();
      parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:1,
        decay:0.03+Math.random()*0.03, size:3+Math.random()*4,
        color:color || "#fff", rot:0, vr:0, kind:"spark", g:0.05 });
    }
  }
  function dust(x, y, n) {
    for (var i = 0; i < (n||8); i++) {
      var a = -Math.PI + Math.random()*Math.PI, sp = 2+Math.random()*3;
      if (parts.length >= (reduced ? 32 : 150)) parts.shift();
      parts.push({ x:x, y:y, vx:Math.cos(a)*sp*1.6, vy:Math.sin(a)*sp*0.5, life:1,
        decay:0.04+Math.random()*0.03, size:6+Math.random()*8,
        color:"rgba(255,255,255,.5)", rot:0, vr:0, kind:"dust", g:0.02 });
    }
  }
  function updateParts(dt) {
    var k = dt * 60;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g * k; p.vx *= Math.pow(0.99, k);
      p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
      p.life -= p.decay * k;
      if (p.life <= 0 || p.y > H + 60) parts.splice(i, 1);
    }
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.save(); ctx.globalAlpha = Math.max(p.life, 0);
      if (p.kind === "spark") {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
      } else if (p.kind === "dust") {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(0.6+p.life*0.6), 0, Math.PI*2); ctx.fill();
      } else {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.55);
      }
      ctx.restore();
    }
  }

  /* All art is original Canvas geometry: no remote fonts, images or emoji actors. */
  var THEMES = [
    {body:"#f28b87", light:"#ffbeb0", dark:"#d66474", hair:"#694858", cheek:"#ec697a", shoe:"#b95067"},
    {body:"#79bdce", light:"#bce6e9", dark:"#4a93ad", hair:"#3a647b", cheek:"#e18d9e", shoe:"#417f9c"},
    {body:"#94c98b", light:"#d3e9ad", dark:"#66a579", hair:"#456d61", cheek:"#e1a083", shoe:"#4d8c70"}

    if(view==="game"){drag={id:e.pointerId,game:true};moveMainTo(p);return;}

    if(i>=0){selected=i;hint(["あかい おにさんと あそぼう！","あおい おにさんと あそぼう！","みどりの おにさんと あそぼう！"][i]);var o=onis[i];drag={id:e.pointerId,oni:o,moved:false,x:p.x,y:p.y,offx:p.x-o.x,offy:p.y-o.y};o.held=true;o.happy=1;sparkle(p.x,p.y,5,2,"#fff9df");}
    else{sparkle(p.x,p.y,9,3,"#d9ad61");onis.forEach(function(o){setSpecial(o,visualTime,"jump");});pickSound(2);}
  });
  canvas.addEventListener("pointermove",function(e){
    if(!drag||drag.id!==e.pointerId)return;e.preventDefault();var p=point(e);
    if(drag.game){moveMainTo(p);return;}
    if(Math.hypot(p.x-drag.x,p.y-drag.y)>7)drag.moved=true;
    if(drag.moved){boundOni(drag.oni,p.x-drag.offx,p.y-drag.offy);if(parts.length<90)sparkle(p.x,p.y,1,1,"#f1bc7a");}
  });
  canvas.addEventListener("pointerup",function(e){
    if(!drag||drag.id!==e.pointerId)return;
    var current=drag;cancelDrag();
    if(!current.game){celebrate(current.oni,current.moved?"jump":tapCount%3===2?"spin":"jump");}
  });
  canvas.addEventListener("pointercancel",cancelDrag);
  canvas.addEventListener("lostpointercapture",function(){if(drag)cancelDrag();});
  canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
  canvas.addEventListener("keydown",function(e){
    if(view==="dance" && (e.key===" "||e.key==="Enter")){e.preventDefault();celebrate(onis[selected],"jump");}
    else if(view==="game"&&!game.over && ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
      e.preventDefault();var m=onis[0];boundOni(m,m.x+(e.key==="ArrowLeft"?-20:e.key==="ArrowRight"?20:0),m.y+(e.key==="ArrowUp"?-20:e.key==="ArrowDown"?20:0));
    }
  });
  function setView(next) {
    cancelDrag();view=next;mode=next==="game"?"game":"dance";app.dataset.view=next;
    document.getElementById("intro").hidden=next!=="home";
    document.getElementById("home-controls").hidden=next!=="home";
    document.getElementById("actions").hidden=next!=="dance";
    document.getElementById("hint").hidden=next!=="dance";
    document.getElementById("hud").hidden=next!=="game";
    document.getElementById("game-help").hidden=next!=="game";
    backBtn.hidden=next==="home";overEl.hidden=true;
    document.getElementById("footnote").textContent=next==="home"?"タッチで あそべる、おにの おともだち。":next==="dance"?"じかんも、まちがいも、ないよ。":"あかい おにさんを ゆびで うごかそう。";
    parts.length=0;game.items.length=0;game.over=false;selected=0;resize();
  }
  function begin(next){setView(next);if(next==="game")startGameMode();else{hint("おにさんを さわってみよう");onis.forEach(function(o){setSpecial(o,visualTime,"jump");});}resumeSound();startLoop();backBtn.focus();}
  function goHome(){stopMusic();if(actx)actx.suspend().catch(function(){});setView("home");document.querySelector('[data-mode="dance"]').focus();}
  function resumeIfInterrupted(){if(musicOn&&view!=="home"&&actx&&actx.state!=="running")resumeSound();}
  document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){begin(b.dataset.mode);});});
  document.querySelectorAll("[data-action]").forEach(function(b){b.addEventListener("click",function(){resumeIfInterrupted();action(b.dataset.action);});});
  retryBtn.addEventListener("click",function(){begin("game");});backBtn.addEventListener("click",goHome);document.getElementById("overHome").addEventListener("click",goHome);
  soundBtn.addEventListener("click",function(){
    musicOn=!musicOn;soundBtn.setAttribute("aria-pressed",String(musicOn));soundBtn.setAttribute("aria-label",musicOn?"おとを けす":"おとを だす");soundBtn.querySelector("span").textContent=musicOn?"おと あり":"おと なし";
    if(musicOn)resumeSound();else{stopMusic();if(actx)actx.suspend().catch(function(){});}
  });
  function sleep(){cancelDrag();if(raf)cancelAnimationFrame(raf);raf=0;lastFrame=0;stopMusic();if(actx)actx.suspend().catch(function(){});}
  function wake(){if(!document.hidden){startLoop();resumeSound();}}
  document.addEventListener("visibilitychange",function(){if(document.hidden)sleep();else wake();});
  window.addEventListener("pagehide",sleep);window.addEventListener("pageshow",wake);window.addEventListener("blur",cancelDrag);
  window.addEventListener("resize",resize);
  if(window.visualViewport)window.visualViewport.addEventListener("resize",resize);
  new ResizeObserver(resize).observe(scene);
  function motionChange(e){reduced=e.matches;parts.length=0;}
  if(reducedQuery.addEventListener)reducedQuery.addEventListener("change",motionChange);else reducedQuery.addListener(motionChange);
  // Keep focus inside the catch result sheet, while leaving normal buttons native.
  document.addEventListener("keydown",function(e){if(!overEl.hidden&&e.key==="Tab"){
    var home=document.getElementById("overHome");
    if(e.shiftKey&&document.activeElement===retryBtn){e.preventDefault();home.focus();}
    else if(!e.shiftKey&&document.activeElement===home){e.preventDefault();retryBtn.focus();}
  }});
  resize();startLoop();
})();
</script>
</body>
</html>
