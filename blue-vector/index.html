<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>BLUE VECTOR — MVP</title>
<style>
:root{color-scheme:dark;--bg:#06101c;--panel:#0b1d2f;--line:#4bc2ff;--accent:#ffe16b;--danger:#ff6b78;--text:#ecf7ff;--muted:#88a9bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02070d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);touch-action:none}
body{display:grid;place-items:center}
#shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;background:var(--bg);overflow:hidden;border-inline:1px solid #17354b}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#06101c}
#topbar{position:absolute;inset:env(safe-area-inset-top) 10px auto 10px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000}
.hudBox{background:#06101ccc;border:1px solid #2d6382;border-radius:8px;padding:6px 8px;backdrop-filter:blur(3px)}
#controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 12px;z-index:7;pointer-events:none}
.ctrlGroup{display:flex;gap:10px;pointer-events:auto}
.touchBtn{width:74px;height:74px;border-radius:50%;border:2px solid #6ecfff88;background:#0b2238bb;color:#dff6ff;font:700 12px ui-monospace;touch-action:none;user-select:none}
.touchBtn.small{width:58px;height:58px;border-color:#ffe16b99;color:#fff2a6}
#screen,#upgrade{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:28px;background:linear-gradient(#04101be8,#02070df0);text-align:center}
#screen.hidden,#upgrade.hidden{display:none}
.card{width:min(92%,400px);border:1px solid #3a7fa7;background:#081726f2;border-radius:16px;padding:22px;box-shadow:0 12px 50px #0008}
h1{font-size:clamp(34px,10vw,56px);letter-spacing:.08em;margin:0 0 6px;color:#dff6ff}
.sub{color:#70ccff;letter-spacing:.18em;font-size:11px;margin-bottom:22px}
button{font:inherit}
.primary{border:1px solid #63cfff;background:#0d3554;color:white;border-radius:10px;padding:13px 22px;font-weight:700;letter-spacing:.08em}
.hint{color:var(--muted);font-size:11px;line-height:1.7;margin-top:16px}
#upgrade .card{width:min(96%,430px)}
.upTitle{font-size:20px;color:#fff2a6;margin-bottom:4px}.upSub{font-size:11px;color:#8fb3c9;margin-bottom:16px}
#upgradeOptions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upgradeBtn{min-height:92px;text-align:left;border:1px solid #315d76;background:#0c2235;color:white;border-radius:10px;padding:11px}
.upgradeBtn strong{display:block;color:#7dd7ff;margin-bottom:5px;font-size:13px}.upgradeBtn span{display:block;color:#abc2d1;font-size:10px;line-height:1.45}
#bossWarn{position:absolute;top:38%;left:0;right:0;z-index:9;text-align:center;font-size:28px;font-weight:900;letter-spacing:.14em;color:#ff9fa7;text-shadow:0 2px 0 #58151d;opacity:0;pointer-events:none}
#bossWarn.show{animation:warn 2s ease both}@keyframes warn{0%,100%{opacity:0;transform:scale(.8)}20%,80%{opacity:1;transform:scale(1)}}
@media (hover:hover) and (pointer:fine){#controls{opacity:.35}.touchBtn{width:60px;height:60px}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="480" height="800" aria-label="縦スクロールシューティングゲーム"></canvas>
  <div id="topbar">
    <div class="hudBox" id="hudLeft">LIFE 5 · BOMB 2</div>
    <div class="hudBox" id="hudRight">SCORE 000000 · CHIP 0/3</div>
  </div>
  <div id="bossWarn">WARNING</div>
  <div id="controls">
    <div class="ctrlGroup"><button class="touchBtn" id="fireBtn">FIRE</button></div>
    <div class="ctrlGroup"><button class="touchBtn small" id="bombBtn">BOMB</button></div>
  </div>
  <div id="screen">
    <div class="card">
      <div class="sub">AERIAL FORMATION SHOOTER</div>
      <h1>BLUE VECTOR</h1>
      <p>青白の架空アクロバットジェットで突入する、レトロ縦スクロールSTG。</p>
      <button id="startBtn" class="primary">START MISSION</button>
      <div class="hint">PC: 矢印 / WASD 移動 · Z/Space 射撃 · X/B ボム<br>Touch: 画面ドラッグで移動 · FIRE / BOMB</div>
    </div>
  </div>
  <div id="upgrade" class="hidden">
    <div class="card">
      <div class="upTitle">POWER SELECT</div>
      <div class="upSub">戦闘を一旦停止。1つ選択すると即再開。</div>
      <div id="upgradeOptions"></div>
    </div>
  </div>
</div>
<script>
'use strict';
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const screen=document.getElementById('screen'),upgradeEl=document.getElementById('upgrade');
const hudLeft=document.getElementById('hudLeft'),hudRight=document.getElementById('hudRight');
const bossWarn=document.getElementById('bossWarn');
const keys=new Set();
let running=false,paused=false,last=0,spawnTimer=0,stageTime=0,bossSpawned=false,gameOver=false,win=false;
let enemies=[],bullets=[],enemyBullets=[],chips=[],particles=[];
const stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5,v:20+Math.random()*70}));
const player={x:W/2,y:H-125,r:11,lives:5,bombs:2,invuln:0,shot:1,power:0,speed:0,shield:0,laser:0,support:0,chip:0,score:0,fireCd:0};
const UPGRADES={
 shot:{name:'SHOT',desc:'Single → Twin → 3-Way → 5-Way。',max:4},
 power:{name:'POWER',desc:'弾速・威力・連射速度をまとめて強化。',max:3},
 speed:{name:'SPEED',desc:'移動速度アップ。操作不能にならない上限あり。',max:3},
 shield:{name:'SHIELD',desc:'次の被弾を1回無効化するバリア。',max:1},
 laser:{name:'LASER',desc:'一定間隔で貫通レーザーを混ぜる。',max:2},
 support:{name:'WINGMAN',desc:'随伴機を追加。自機と一緒に射撃する。',max:2},
 bomb:{name:'BOMB+',desc:'ボムを1個補給。敵弾消去＋全体ダメージ。',max:99}
};
function reset(){Object.assign(player,{x:W/2,y:H-125,lives:5,bombs:2,invuln:0,shot:1,power:0,speed:0,shield:0,laser:0,support:0,chip:0,score:0,fireCd:0});enemies=[];bullets=[];enemyBullets=[];chips=[];particles=[];spawnTimer=0;stageTime=0;bossSpawned=false;gameOver=false;win=false;paused=false;upgradeEl.classList.add('hidden');updateHud()}
function start(){reset();running=true;screen.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(message){running=false;gameOver=!win;screen.classList.remove('hidden');screen.querySelector('h1').textContent=message;screen.querySelector('p').textContent=`SCORE ${String(player.score).padStart(6,'0')}`;document.getElementById('startBtn').textContent='RESTART'}
function updateHud(){hudLeft.textContent=`LIFE ${player.lives} · BOMB ${player.bombs}${player.shield?' · SHIELD':''}`;hudRight.textContent=`SCORE ${String(player.score).padStart(6,'0')} · CHIP ${player.chip}/3`}
function fire(){if(player.fireCd>0||paused||!running)return;const fireDelay=Math.max(.082,.145-player.power*.018),shotSpeed=520+player.power*70,shotDamage=1+(player.power>=2?1:0)+(player.power>=3?1:0);player.fireCd=fireDelay;const patterns={1:[0],2:[-.12,.12],3:[-.25,0,.25],4:[-.5,-.25,0,.25,.5]};const arr=patterns[Math.min(player.shot,4)];for(const a of arr){bullets.push({x:player.x,y:player.y-15,vx:a*240,vy:-shotSpeed,r:3,d:shotDamage,pierce:false})}if(player.laser&&Math.floor(stageTime*10)%Math.max(2,6-player.laser*2)===0)bullets.push({x:player.x,y:player.y-18,vx:0,vy:-(760+player.power*50),r:5,d:2+Math.floor(player.power/2),pierce:true,laser:true});wingmen().forEach(w=>bullets.push({x:w.x,y:w.y-8,vx:0,vy:-(470+player.power*45),r:2.6,d:1+(player.power>=3?1:0),pierce:false,support:true}))}
function wingmen(){const out=[];if(player.support>=1)out.push({x:player.x-28,y:player.y+9});if(player.support>=2)out.push({x:player.x+28,y:player.y+9});return out}
function bomb(){if(!running||paused||player.bombs<=0)return;player.bombs--;enemyBullets=[];for(const e of enemies)e.hp-=8;burst(player.x,player.y,48,'#ffe16b');updateHud()}
function spawnEnemy(){const t=stageTime,roll=Math.random();if(roll<.2)enemies.push({type:'ace',x:60+Math.random()*(W-120),y:-30,r:17,hp:5,maxHp:5,vy:80,phase:Math.random()*6.2,shot:.8});else if(roll<.55)enemies.push({type:'zig',x:40+Math.random()*(W-80),y:-25,r:13,hp:2,maxHp:2,vy:115,phase:Math.random()*6.2,shot:1.5});else enemies.push({type:'scout',x:30+Math.random()*(W-60),y:-20,r:11,hp:1,maxHp:1,vy:140,phase:0,shot:2});spawnTimer=Math.max(.28,.72-t*.004)}
function spawnBoss(){bossSpawned=true;bossWarn.classList.remove('show');void bossWarn.offsetWidth;bossWarn.classList.add('show');setTimeout(()=>{if(running)enemies.push({type:'boss',x:W/2,y:110,r:60,hp:120,maxHp:120,vy:0,phase:0,shot:.55,boss:true})},1400)}
function enemyShoot(e){if(e.boss){for(let i=0;i<9;i++){const a=Math.PI/2+(i-4)*.15+Math.sin(stageTime*.8)*.12;enemyBullets.push({x:e.x,y:e.y+28,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5})}}else{const dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1;enemyBullets.push({x:e.x,y:e.y+8,vx:dx/len*120,vy:dy/len*120,r:4})}}
function hitPlayer(){if(player.invuln>0)return;if(player.shield>0){player.shield=0;player.invuln=.5;burst(player.x,player.y,16,'#67d8ff');updateHud();return}player.lives--;player.invuln=2;burst(player.x,player.y,28,'#ff6b78');if(player.shot>1)player.shot--;else if(player.power>0)player.power--;else if(player.laser>0)player.laser--;else if(player.support>0)player.support--;if(player.lives<=0){end('MISSION FAILED');return}player.x=W/2;player.y=H-125;updateHud()}
function dropChip(e){const chance=e.boss?0:e.type==='ace'?.72:e.type==='zig'?.24:.1;if(Math.random()<chance)chips.push({x:e.x,y:e.y,r:8,vy:95,spin:0})}
function chooseUpgrades(){paused=true;upgradeEl.classList.remove('hidden');const available=Object.keys(UPGRADES).filter(k=>k==='bomb'||player[k]<UPGRADES[k].max);for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]]}const picks=available.slice(0,4);const wrap=document.getElementById('upgradeOptions');wrap.innerHTML='';picks.forEach((k,idx)=>{const b=document.createElement('button');b.className='upgradeBtn';b.innerHTML=`<strong>${idx+1}. ${UPGRADES[k].name}</strong><span>${UPGRADES[k].desc}</span>`;b.onclick=()=>applyUpgrade(k);wrap.appendChild(b)});window.__upgradePicks=picks}
function applyUpgrade(k){if(k==='bomb')player.bombs=Math.min(6,player.bombs+1);else player[k]=Math.min(UPGRADES[k].max,player[k]+1);player.chip=0;upgradeEl.classList.add('hidden');paused=false;updateHud()}
function burst(x,y,n,color){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.55,color})}}
function collide(a,b,extra=0){return Math.hypot(a.x-b.x,a.y-b.y)<(a.r+b.r+extra)}
function update(dt){if(paused||!running)return;stageTime+=dt;player.invuln=Math.max(0,player.invuln-dt);player.fireCd=Math.max(0,player.fireCd-dt);const base=210+player.speed*52;let dx=0,dy=0;if(keys.has('ArrowLeft')||keys.has('KeyA'))dx--;if(keys.has('ArrowRight')||keys.has('KeyD'))dx++;if(keys.has('ArrowUp')||keys.has('KeyW'))dy--;if(keys.has('ArrowDown')||keys.has('KeyS'))dy++;if(dx||dy){const l=Math.hypot(dx,dy);player.x+=dx/l*base*dt;player.y+=dy/l*base*dt}player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(45,Math.min(H-82,player.y));if(keys.has('KeyZ')||keys.has('Space'))fire();spawnTimer-=dt;if(!bossSpawned&&stageTime<50&&spawnTimer<=0)spawnEnemy();if(!bossSpawned&&stageTime>=50)spawnBoss();for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=-3;s.x=Math.random()*W}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.y>-40&&b.x>-40&&b.x<W+40&&!b.dead);for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(collide(b,player,-2)){b.dead=true;hitPlayer()}}enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.x>-30&&b.x<W+30&&!b.dead);for(const e of enemies){e.phase+=dt;if(e.type==='scout')e.y+=e.vy*dt;else if(e.type==='zig'){e.y+=e.vy*dt;e.x+=Math.sin(e.phase*3.4)*95*dt}else if(e.type==='ace'){e.y+=e.vy*dt;e.x+=Math.sin(e.phase*2.2)*135*dt}else if(e.boss){e.x=W/2+Math.sin(stageTime*.75)*135;e.y=105+Math.sin(stageTime*1.2)*16}e.shot-=dt;if(e.shot<=0){enemyShoot(e);e.shot=e.boss?.55:(e.type==='ace'?.9:1.8)}if(collide(e,player,-4)){e.hp-=4;hitPlayer()}}for(const b of bullets){for(const e of enemies){if(e.hp>0&&collide(b,e,0)){e.hp-=b.d;if(!b.pierce)b.dead=true;burst(b.x,b.y,b.laser?5:2,b.laser?'#68e9ff':'#ffe16b');break}}}const dead=[];for(const e of enemies){if(e.hp<=0){dead.push(e);player.score+=e.boss?5000:e.type==='ace'?300:e.type==='zig'?140:80;dropChip(e);burst(e.x,e.y,e.boss?80:18,e.boss?'#ff9a73':'#ffcb65');if(e.boss){win=true;setTimeout(()=>end('MISSION CLEAR'),700)}}}enemies=enemies.filter(e=>!dead.includes(e)&&e.y<H+80);for(const c of chips){c.y+=c.vy*dt;c.spin+=dt*5;if(collide(c,player,2)){c.dead=true;player.chip=Math.min(3,player.chip+1);player.score+=50;updateHud();if(player.chip>=3)chooseUpgrades()}}chips=chips.filter(c=>!c.dead&&c.y<H+30);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}particles=particles.filter(p=>p.life>0);updateHud()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071a2d');g.addColorStop(.52,'#0a2b43');g.addColorStop(1,'#07101b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin((s.x+s.y)*.02);ctx.fillStyle='#dff6ff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;ctx.strokeStyle='#21465d';ctx.lineWidth=1;for(let y=(stageTime*70)%64-64;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const c of chips){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.spin);ctx.strokeStyle='#ffe16b';ctx.fillStyle='#6b5513';ctx.lineWidth=2;ctx.fillRect(-7,-7,14,14);ctx.strokeRect(-7,-7,14,14);ctx.restore()}for(const b of bullets){ctx.fillStyle=b.laser?'#7ff8ff':b.support?'#a9ddff':'#ffe16b';if(b.laser)ctx.fillRect(b.x-3,b.y-15,6,28);else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}}for(const b of enemyBullets){ctx.fillStyle='#ff6b78';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#ffd0d5';ctx.stroke()}for(const e of enemies)drawEnemy(e);wingmen().forEach(drawWing);drawPlayer();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(enemies.some(e=>e.boss)){const e=enemies.find(e=>e.boss);ctx.fillStyle='#02070dcc';ctx.fillRect(44,54,W-88,14);ctx.fillStyle='#ff6b78';ctx.fillRect(46,56,(W-92)*Math.max(0,e.hp/e.maxHp),10);ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText('BOSS',48,50)}}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);if(player.invuln>0&&Math.floor(player.invuln*12)%2===0)ctx.globalAlpha=.3;if(player.shield){ctx.strokeStyle='#66e7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.stroke()}ctx.fillStyle='#e8f7ff';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(11,9);ctx.lineTo(5,7);ctx.lineTo(0,15);ctx.lineTo(-5,7);ctx.lineTo(-11,9);ctx.closePath();ctx.fill();ctx.fillStyle='#1c75a5';ctx.fillRect(-3,-11,6,19);ctx.fillStyle='#5ecaff';ctx.fillRect(-9,4,18,3);ctx.restore()}
function drawWing(w){ctx.save();ctx.translate(w.x,w.y);ctx.fillStyle='#7ccfff';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(6,6);ctx.lineTo(0,3);ctx.lineTo(-6,6);ctx.closePath();ctx.fill();ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);if(e.boss){ctx.fillStyle='#44384a';ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(58,20);ctx.lineTo(23,14);ctx.lineTo(0,44);ctx.lineTo(-23,14);ctx.lineTo(-58,20);ctx.closePath();ctx.fill();ctx.fillStyle='#ff6676';ctx.fillRect(-5,-21,10,34)}else{ctx.fillStyle=e.type==='ace'?'#ffb45d':e.type==='zig'?'#caa6ff':'#ff7684';ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(10,-10);ctx.lineTo(0,-6);ctx.lineTo(-10,-10);ctx.closePath();ctx.fill()}ctx.restore()}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='KeyX'||e.code==='KeyB')bomb();if(paused&&/^Digit[1-4]$/.test(e.code)){const i=Number(e.code.slice(-1))-1,arr=window.__upgradePicks||[];if(arr[i])applyUpgrade(arr[i])}});window.addEventListener('keyup',e=>keys.delete(e.code));
let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);movePointer(e)});canvas.addEventListener('pointermove',e=>{if(dragging)movePointer(e)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);function movePointer(e){if(!running||paused)return;const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;player.y=(e.clientY-r.top)/r.height*H;player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(50,Math.min(H-82,player.y))}
const fireBtn=document.getElementById('fireBtn'),bombBtn=document.getElementById('bombBtn');let fireInterval=0;fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();fire();fireInterval=setInterval(fire,110)});['pointerup','pointercancel','pointerleave'].forEach(ev=>fireBtn.addEventListener(ev,()=>{clearInterval(fireInterval);fireInterval=0}));bombBtn.addEventListener('pointerdown',e=>{e.preventDefault();bomb()});document.getElementById('startBtn').onclick=start;
window.__gameDebug={getState:()=>({running,paused,stageTime,bossSpawned,player:{...player},enemyCount:enemies.length,bulletCount:bullets.length}),getBullets:()=>bullets.map(b=>({...b})),start,fire,clearPlayerBullets:()=>{bullets=[];player.fireCd=0},forceChip:()=>{player.chip=2;chips.push({x:player.x,y:player.y,r:8,vy:0,spin:0})},forceBoss:()=>{stageTime=50.1},bomb,applyUpgrade};
draw();updateHud();
})();
</script>
</body>
</html>
