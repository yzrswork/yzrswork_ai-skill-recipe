<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>移動しました -- 直し方ナビ</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://apps.yzrswork.com/fixit/" />
<meta http-equiv="refresh" content="0; url=https://apps.yzrswork.com/fixit/" />
<script>
  (function () {
    var target = 'https://apps.yzrswork.com/fixit/' + (location.hash || '');
    var scope = location.href.replace(/[^/]*$/, '');
    var go = function () { location.replace(target); };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope === scope; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
      setTimeout(go, 400);
    } else {
      go();
    }
  })();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#faf7f2;color:#2b2724}
.box{text-align:center;padding:24px;line-height:1.9}
a{color:#b5451b}
</style>
</head>
<body>
<div class="box">
  <p>直し方ナビ は や印工務店の道具箱（apps.yzrswork.com）へ移動しました。</p>
  <p><a href="https://apps.yzrswork.com/fixit/">自動で移動しない場合はこちらをタップ</a></p>
</div>
</body>
</html>
